# =============================================================================
# JAYCE - AI ENGINE PACKAGE
# =============================================================================
# AI orchestration package using LangGraph.
# This package is PURE and MUST NOT import anything from `api`.
#
# Principles:
# - SOLID: Single Responsibility - only AI orchestration
# - Low Coupling: Zero dependencies on Django or the `api` package
# - DI: Factory pattern for configuration injection
# =============================================================================

[project]
name = "jayce"
version = "0.1.0"
description = "AI Engine - LangGraph orchestration library for Assistente"
readme = "README.md"
requires-python = ">=3.13"

# AI/ML dependencies ONLY - no Django
dependencies = [
    "langgraph-checkpoint-postgres>=3.0.4",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "aiosqlite>=0.22.1",
    "langchain>=1.2.9",
    "langchain-ollama>=0.3.3",
    "langchain-tavily>=0.2.17",
    "langgraph>=1.0.8",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyright>=1.1.408",
    "rich>=14.3.2",
]

# Optional dependencies for different providers
[project.optional-dependencies]
openai = ["langchain-openai>=0.3.0"]
anthropic = ["langchain-anthropic>=0.3.0"]
google = ["langchain-google-genai>=2.0.0"]
all = [
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# =============================================================================
# HATCH BUILD CONFIGURATION
# =============================================================================
# Define src layout structure for the package
# =============================================================================

[tool.hatch.build.targets.wheel]
packages = ["src/jayce"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
]

# =============================================================================
# ENTRY POINTS (optional CLI)
# =============================================================================

[project.scripts]
jayce = "jayce.presentation.cli:cli"

# =============================================================================
# PYRIGHT LOCAL OVERRIDES
# =============================================================================

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
