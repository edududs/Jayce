# =============================================================================
# WHATSAPP - INTEGRATION PACKAGE
# =============================================================================
# Package para integração com WhatsApp via Neonize (protocolo Go/Whatsmeow).
# Sem browser: QR no terminal, conexão direta ao servidor.
#
# Princípios:
# - Single Responsibility: apenas canal WhatsApp (sessão, envio, recebimento)
# - Low Coupling: zero dependências de Django ou jayce (injetáveis se necessário)
# =============================================================================

[project]
name = "whatsapp"
version = "0.1.0"
description = "WhatsApp integration for Assistente via Neonize (no browser)"
requires-python = ">=3.13"

dependencies = [
    "jayce",
    "neonize>=0.3.14",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "rich>=14.3.2",
    "segno>=1.6.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.115.0", "uvicorn[standard]>=0.34.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whatsapp"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests"]

[project.scripts]
whatsapp = "whatsapp.main:cli"

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
