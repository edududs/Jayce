[project]
name = "api"
version = "0.1.0"
description = "Django API for Assistente - Productivity System"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # Django Stack
    "django>=6.0",
    "django-ninja>=1.5.1",
    "django-stubs>=5.2.8",
    
    # AI Engine (workspace local dependency)
    "jayce",
    
    # Utilities
    "rich>=14.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.9.0",
    "ruff>=0.15.0",
]
prod = [
    "gunicorn>=23.0.0",
    "uvicorn>=0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# =============================================================================
# UV SOURCES - Local workspace resolution
# =============================================================================
# Define que `jayce` deve ser resolvido do workspace local, não do PyPI
# =============================================================================

[tool.uv.sources]
jayce = { workspace = true }

# =============================================================================
# HATCH BUILD CONFIGURATION
# =============================================================================

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/manage.py",
    "/README.md",
]

# =============================================================================
# ENTRY POINTS (Django management)
# =============================================================================

[project.scripts]
dj = "manage:main"

# =============================================================================
# DJANGO CONFIGURATION
# =============================================================================

[tool.django-stubs]
django_settings_module = "core.settings"

# =============================================================================
# PYRIGHT LOCAL OVERRIDES
# =============================================================================

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
