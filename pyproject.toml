# =============================================================================
# ROOT WORKSPACE MANIFEST
# =============================================================================
# Este é o pyproject.toml raiz que orquestra o monorepo com uv workspaces.
# Ele não é um package em si, apenas define quais membros fazem parte do workspace.
# =============================================================================

[project]
name = "assistente-workspace"
version = "0.1.0"
description = "Monorepo workspace para o Assistente de Produtividade com AI"
readme = "README.md"
requires-python = ">=3.13"
# Workspace roots não devem ter dependências - elas vivem nos packages membros
dependencies = [
    "fastapi>=0.129.0",
    "ipdb>=0.13.13",
    "neonize>=0.3.14.post0",
    "psycopg[binary]>=3.3.2",
    "pytest>=9.0.2",
    "rich>=14.3.2",
    "typer>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# =============================================================================
# UV WORKSPACE CONFIGURATION
# =============================================================================
# Define os packages membros do monorepo. O uv resolve dependências locais
# automaticamente quando usamos `package = { workspace = true }`.
# =============================================================================

[tool.uv]
managed = true
package = false  # Este arquivo raiz não é um package instalável

[tool.uv.workspace]
members = ["api", "jayce", "whatsapp"]

# =============================================================================
# SOURCES - Referências locais para desenvolvimento
# =============================================================================

[tool.uv.sources]
jayce = { workspace = true }
api = { workspace = true }
whatsapp = { workspace = true }

# =============================================================================
# SHARED TOOLING CONFIGURATION
# =============================================================================

[tool.ruff]
line-length = 100
target-version = "py313"
fix = true
show-fixes = true
indent-width = 4
exclude = [".venv", "__pycache__", ".ruff_cache"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "T201",   # print statements (útil em dev)
    "COM812", # trailing commas
    "INP001", # missing __init__.py
    "D",      # pydocstyle (documentação detalhada)
    "ANN401", # Any type annotations
    "ERA001", # commented code
    "A004",   # shadowing builtins
    "DOC201",
    "TID252",
    "DOC501",
    "FBT003",
    "PLC0415",
    "TC",
    "D",
    "CPY"
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN201", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["jayce", "api", "whatsapp"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
include = ["api/src/api", "jayce/src/jayce", "whatsapp/src/whatsapp"]
exclude = [
    "**/venv",
    "**/.venv",
    "**/node_modules",
    "**/__pycache__",
]
reportUnusedParameter = "none"

[tool.pytest.ini_options]
addopts = "-s --color=yes --tb=short"
pythonpath = ["jayce/src", "api/src", "whatsapp/src"]
testpaths = ["jayce/tests", "api/tests"]
